<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ habit['name'] }} - DayGraph</title>
</head>

<body>

    <h1>{{ habit['name'] }}</h1>

    <p>Unit: {{ habit['unit'] }}</p>

    <p>
        Direction:
        {% if habit['direction'] == 'higher' %}
            Higher is better
        {% else %}
            Lower is better
        {% endif %}
    </p>

    <a href="/">← Back to Home</a>

</body>
</html>
