<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Habit - DayGraph</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="habit-page">

    <!-- ============================================================
         ADD HABIT HEADER
         ============================================================ -->

    <header class="habit-header">
        <a href="{{ url_for('home') }}" class="back-link">
            ← Back to Home
        </a>

        <h1>Add Habit</h1>
        <p>Create a new habit to start tracking your progress.</p>
    </header>


    <!-- ============================================================
         ADD HABIT FORM
         ============================================================ -->

    <section class="habit-section">

        <form
            class="entry-form"
            action="{{ url_for('add_habit') }}"
            method="POST"
        >

            <div>
                <label for="name">Habit Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div>
                <label for="unit">Unit</label>

                <input
                    type="text"
                    id="unit"
                    name="unit"
                    required
                >
            </div>

            <div>
                <label for="direction">Direction</label>

                <select
                    id="direction"
                    name="direction"
                    required
                >
                    <option value="higher">Higher is better</option>
                    <option value="lower">Lower is better</option>
                </select>
            </div>

            <button type="submit">Save Habit</button>

        </form>

    </section>

</main>

</body>
</html>
