<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Activity - Pulse</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<main class="habit-page">

    <!-- ============================================================
         ADD ACTIVITY HEADER
         ============================================================ -->

    <header class="habit-header">

        <a href="{{ url_for('home') }}" class="back-link">
            ← Back to Pulse
        </a>

        <h1>Add Activity</h1>

        <p>
            Create a measurable activity to start tracking your progress.
        </p>

    </header>


    <!-- ============================================================
         ADD ACTIVITY FORM
         ============================================================ -->

    <section class="habit-section">

        <form
            class="entry-form"
            action="{{ url_for('add_habit') }}"
            method="POST"
        >

            <div>
                <label for="name">Activity Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="e.g. Running"
                    required
                >
            </div>


            <div>
                <label for="unit">Unit</label>

                <input
                    type="text"
                    id="unit"
                    name="unit"
                    placeholder="e.g. km"
                    required
                >
            </div>


            <div>
                <label for="direction">Direction</label>

                <select
                    id="direction"
                    name="direction"
                    required
                >

                    <option value="higher">
                        Higher is better
                    </option>

                    <option value="lower">
                        Lower is better
                    </option>

                </select>
            </div>


            <button type="submit">
                Save Activity
            </button>

        </form>

    </section>

</main>

</body>
</html>
